<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Official Elementarium Wiki – elements, sub-elements, quests, nations, codes and progression.">
<title>Elementarium Wiki — Official Guide</title>
<style>
:root{color-scheme:dark;--bg:#0b100f;--panel:#151e1c;--panel2:#1d2925;--line:#34413b;--gold:#d8bd7d;--muted:#abb8b1;--text:#f2efe5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -30%,#233b32 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;max-width:1300px;margin:auto;padding:0 24px}.mark{font-size:29px;color:var(--gold)}.brand{font-family:Georgia,serif;letter-spacing:.13em;font-size:20px;color:var(--gold);font-weight:700}.brand small{display:block;font:11px system-ui;letter-spacing:.25em;color:var(--muted)}.search{margin-left:auto;max-width:390px;width:100%;border:1px solid var(--line);background:#111a17;color:var(--text);padding:12px 14px;border-radius:10px}select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1300px;margin:0 auto;min-height:calc(100vh - 76px)}aside{padding:26px 18px;border-right:1px solid var(--line)}aside p{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:16px 10px 10px}nav button{width:100%;background:none;border:0;border-radius:9px;color:var(--muted);text-align:left;padding:10px 13px}nav button:hover,nav button.active{color:var(--gold);background:#28322c}main{padding:32px 42px 70px;min-width:0}.hero{min-height:260px;display:flex;align-items:center;padding:30px 40px;border:1px solid #66583a;border-radius:18px;background:radial-gradient(circle at 78% 50%,#4d5333 0,#202d25 42%,#111a16 85%);position:relative;overflow:hidden}.hero:after{content:"☯";font-size:230px;position:absolute;right:42px;top:-55px;opacity:.12;color:var(--gold)}.hero>div{z-index:1}.eyebrow{color:var(--gold);letter-spacing:.23em;font-size:12px;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(30px,4vw,53px);line-height:1.1;margin:14px 0}h2{font-size:28px;margin:30px 0 16px}h3{font-size:21px;margin:0 0 9px}p{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{display:block;text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));color:var(--text);padding:20px;border-radius:14px;min-height:137px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:var(--gold)}.card .symbol{font-size:32px;display:block;margin-bottom:12px}.card small{color:var(--muted)}.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:15px}.article strong{color:var(--gold)}.tag{color:var(--gold);background:#352f20;padding:5px 10px;font-size:12px;border-radius:20px}.notice{border-left:3px solid var(--gold);padding:12px 18px;background:#27251c;color:#ded2b4;border-radius:0 9px 9px 0}footer{max-width:1300px;margin:auto;border-top:1px solid var(--line);padding:20px 25px;color:var(--muted);font-size:13px}.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px}.links a{border-bottom:1px solid var(--gold);color:var(--gold)}.back{color:var(--gold);background:none;border:0;padding:0 0 17px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.list button{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:16px;text-align:left}.list button:hover{border-color:var(--gold)}.empty{color:var(--muted);padding:30px 0}.desktopHide{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{padding:10px 15px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}aside p{display:none}nav{display:flex;min-width:max-content;gap:5px}nav button{width:auto}main{padding:22px 16px 55px}.cards{grid-template-columns:repeat(2,1fr)}.hero{padding:25px;min-height:225px}.hero:after{right:-65px}.cols{grid-template-columns:1fr}}@media(max-width:560px){header{height:auto;min-height:74px;flex-wrap:wrap;padding:12px 14px;gap:8px}.brand{font-size:16px}.search{order:3;max-width:none}.cards{gap:9px}.card{padding:15px;min-height:125px}.list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="#home" class="mark" aria-label="Home">✧</a><a href="#home" class="brand">ELEMENTARIUM<small>OFFICIAL WIKI</small></a><input class="search" id="search" type="search" placeholder="Search articles..." aria-label="Search articles"><select id="lang" aria-label="Language"><option value="en">English</option><option value="pt">Português</option></select></header>
<div class="layout"><aside><nav id="nav"></nav></aside><main id="main"></main></div>
<footer>© <span id="year"></span> Elementarium Wiki · Fan-created game wiki maintained by the developer. · <a href="https://www.roblox.com/pt/games/121465385646237/Elementarium">Play Elementarium</a></footer>
<script>
const T={en:{home:"Home",elements:"Elements",sub:"Sub-elements",nations:"Nations",classes:"Classes",progression:"Progression",quests:"Quests",pass:"Battle Pass",codes:"Codes",bosses:"Bosses & Raids",updates:"Updates",hero:"Master your element. Choose your path.",intro:"Explore the official guide to Elementarium, a Roblox RPG built around the four elements.",explore:"Explore the wiki",guide:"Game guides",more:"More to explore",pending:"This section is being documented. Details not yet confirmed will be added by the developer.",daily:"Daily quests can be completed up to 5 times per day.",special:"Special quests are distinct from repeatable daily quests.",cap:"Maximum level",titles:"Level milestone titles",coder:"Reward",active:"Known codes",disclaimer:"Code availability has not been verified. Some information may change before release.",back:"← Back to home",search:"Search articles...",none:"No matching articles.",nationsDesc:"Explore the four nations and Unbound City.",elementDesc:"Each element has six planned abilities, including one movement ability.",subDesc:"Discover special elemental disciplines.",classDesc:"Classes affect how abilities play. Controlador and Assassino are concepts in development.",passDesc:"100 planned tiers, with selected tiers containing no reward. Final tier planned: +1 slot.",progressDesc:"Progression is planned up to level 150. Milestone titles at levels 50, 100 and 150.",bossDesc:"Spirit Sealer is the title associated with defeating the Spirit Boss.",updatesDesc:"Official patch notes will be posted here."},pt:{home:"Início",elements:"Elementos",sub:"Subelementos",nations:"Nações",classes:"Classes",progression:"Progressão",quests:"Missões",pass:"Passe de Batalha",codes:"Códigos",bosses:"Chefes e Raids",updates:"Atualizações",hero:"Domine seu elemento. Escolha seu caminho.",intro:"Explore o guia oficial do Elementarium, um RPG de Roblox baseado nos quatro elementos.",explore:"Explore a wiki",guide:"Guias do jogo",more:"Explore mais",pending:"Esta seção ainda está sendo documentada. Informações não confirmadas serão adicionadas pelo desenvolvedor.",daily:"As missões diárias podem ser feitas até 5 vezes por dia.",special:"As missões especiais são diferentes das missões diárias repetíveis.",cap:"Nível máximo",titles:"Títulos por nível",coder:"Recompensa",active:"Códigos conhecidos",disclaimer:"A validade dos códigos não foi verificada. Algumas informações podem mudar antes do lançamento.",back:"← Voltar ao início",search:"Pesquisar artigos...",none:"Nenhum artigo encontrado.",nationsDesc:"Explore as quatro nações e a Cidade Unbound.",elementDesc:"Cada elemento tem seis habilidades planejadas, incluindo uma de locomoção.",subDesc:"Descubra disciplinas elementais especiais.",classDesc:"As classes alteram o estilo das habilidades. Controlador e Assassino são conceitos em desenvolvimento.",passDesc:"100 níveis planejados, alguns sem prêmio. Último nível planejado: +1 slot.",progressDesc:"Progressão planejada até o nível 150. Títulos nos níveis 50, 100 e 150.",bossDesc:"Spirit Sealer é o título por derrotar o Spirit Boss.",updatesDesc:"As notas oficiais de atualização serão publicadas aqui."}};
const pages=[["elements","🌊"],["sub","✧"],["nations","🏯"],["classes","⚔"],["progression","✦"],["quests","📜"],["pass","🎖"],["codes","🎁"],["bosses","☄"],["updates","📣"]];
const articleNames={elements:[["water","🌊","Water","Água"],["earth","🪨","Earth","Terra"],["fire","🔥","Fire","Fogo"],["air","🌪","Air","Ar"]],sub:[["blood","🩸","Blood","Sangue"],["healing","💚","Healing","Cura"],["lava","🌋","Lava","Lava"],["sand","🏜","Sand","Areia"],["metal","⚙","Metal","Metal"],["bluefire","🔵","Blue Fire","Fogo Azul"],["lightning","⚡","Lightning","Raio"],["combustion","💥","Combustion","Combustão"],["sound","◉","Sound","Som"],["projection","👻","Projection","Projeção"]],nations:[["waternation","🌊","Water Nation","Nação da Água"],["earthnation","🪨","Earth Nation","Nação da Terra"],["firenation","🔥","Fire Nation","Nação do Fogo"],["airnation","🌪","Air Nation","Nação do Ar"],["unbound","🏙","Unbound City","Cidade Unbound"]],classes:[["controller","✦","Controller","Controlador"],["assassin","⚔","Assassin","Assassino"]]};
let language=localStorage.getItem("ew_lang")==="pt"?"pt":"en";document.getElementById("lang").value=language;document.getElementById("year").textContent=new Date().getFullYear();const tx=k=>T[language][k]||k, title=(row)=>row[language==="pt"?3:2],esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function card(id,icon,name,sub){return '<a class="card" href="#'+encodeURIComponent(id)+'"><span class="symbol">'+icon+'</span><h3>'+esc(name)+'</h3><small>'+esc(sub||"")+'</small></a>'}
function home(){return '<section class="hero"><div><div class="eyebrow">The Four Elements · Roblox RPG</div><h1>Elementarium Wiki</h1><p>'+tx("hero")+'</p><p>'+tx("intro")+'</p></div></section><h2>'+tx("explore")+'</h2><div class="cards">'+articleNames.elements.map(a=>card("article/elements/"+a[0],a[1],title(a),tx("elements"))).join("")+'</div><h2>'+tx("guide")+'</h2><div class="cards">'+pages.slice(1,9).map(p=>card(p[0],p[1],tx(p[0]),"")).join("")+'</div><div class="links"><a href="https://www.roblox.com/pt/games/121465385646237/Elementarium" target="_blank" rel="noopener">Roblox</a><a href="https://www.tiktok.com/@elementarium_" target="_blank" rel="noopener">TikTok</a><a href="https://www.roblox.com/pt/communities/34259789/Abu-Studios-FE#!/about" target="_blank" rel="noopener">Abu Studios</a></div>'}
function details(category,article){const group=articleNames[category]||[];const a=group.find(x=>x[0]===article);if(!a)return '<p>'+tx("pending")+'</p>';return '<button class="back" onclick="location.hash=\'#'+category+'\'">'+tx("back")+'</button><div class="eyebrow">'+tx(category)+'</div><h1>'+a[1]+' '+esc(title(a))+'</h1><div class="article"><span class="tag">Elementarium</span><p>'+tx("pending")+'</p>'+(category==="elements"?'<p>'+tx("elementDesc")+'</p>':'')+'</div>'}
function categoryPage(k){let content='';if(articleNames[k])content='<div class="cards">'+articleNames[k].map(a=>card("article/"+k+"/"+a[0],a[1],title(a),tx("pending"))).join("")+'</div>';
else if(k==="progression")content='<div class="cols"><div class="article"><h3>'+tx("cap")+'</h3><h1>150</h1></div><div class="article"><h3>'+tx("titles")+'</h3><h1>50 · 100 · 150</h1></div></div><div class="article"><p>'+tx("progressDesc")+'</p></div>';
else if(k==="quests")content='<div class="cols"><div class="article"><h3>Daily / Diárias</h3><p>'+tx("daily")+'</p></div><div class="article"><h3>Special / Especiais</h3><p>'+tx("special")+'</p></div></div>';
else if(k==="codes")content='<p class="notice">'+tx("disclaimer")+'</p><div class="cols"><div class="article"><h3>Swagg</h3><p>2,000 Ryu</p></div><div class="article"><h3>Venus</h3><p>Element Reset</p></div></div>';
else content='<div class="article"><p>'+tx(k==="pass"?"passDesc":k==="bosses"?"bossDesc":k==="updates"?"updatesDesc":"pending")+'</p></div>';
return '<button class="back" onclick="location.hash=\'home\'">'+tx("back")+'</button><div class="eyebrow">Elementarium · Wiki</div><h1>'+tx(k)+'</h1><p>'+tx(k+"Desc")+'</p>'+content}
function render(){const h=decodeURIComponent(location.hash.slice(1))||"home";document.getElementById("nav").innerHTML='<p>Navigation</p><button class="'+(h==="home"?"active":"")+'" onclick="location.hash=\'home\'">⌂ &nbsp; '+tx("home")+'</button><p>Wiki</p>'+pages.map(p=>'<button class="'+(h===p[0]||h.startsWith("article/"+p[0]+"/")?"active":"")+'" onclick="location.hash=\''+p[0]+'\'">'+p[1]+' &nbsp; '+tx(p[0])+'</button>').join("");const parts=h.split("/");document.getElementById("main").innerHTML=h==="home"?home():parts[0]==="article"?details(parts[1],parts[2]):pages.some(x=>x[0]===h)?categoryPage(h):home();document.title=(h==="home"?"Elementarium":tx(parts[0]==="article"?parts[1]:h))+" · Elementarium Wiki"}
document.getElementById("lang").addEventListener("change",e=>{language=e.target.value;localStorage.setItem("ew_lang",language);document.getElementById("search").placeholder=tx("search");render()});document.getElementById("search").addEventListener("input",e=>{let q=e.target.value.toLocaleLowerCase().trim();if(!q){render();return}const items=[...pages.map(p=>({id:p[0],icon:p[1],name:tx(p[0]),sub:"Wiki"})),...Object.entries(articleNames).flatMap(([cat,list])=>list.map(a=>({id:"article/"+cat+"/"+a[0],icon:a[1],name:title(a),sub:tx(cat)})))];const result=items.filter(x=>(x.name+" "+x.sub+" "+x.id).toLocaleLowerCase().includes(q));document.getElementById("main").innerHTML='<h1>Search / Pesquisa</h1>'+(result.length?'<div class="cards">'+result.map(x=>card(x.id,x.icon,x.name,x.sub)).join("")+'</div>':'<p class="empty">'+tx("none")+'</p>')});window.addEventListener("hashchange",()=>{document.getElementById("search").value="";render();window.scrollTo(0,0)});render();
</script>
</body></html>
